# 只追蹤固定到提交 SHA 的 GitHub Actions，每月最多開 3 個 PR（不會自動合併）。
# 不追蹤 pip：requirements.txt 的 numpy、pandas、scikit-learn、scipy 版本是刻意固定的，
# 訓練好的模型（models/2026/*.pkl）與批次雜湊依賴這些版本；升級要先重新驗證數值與模型，不能由機器人直接開 PR。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
