# 讓固定到提交 SHA 的 GitHub Actions 與固定版本的 Python 套件有更新提醒（只開 PR，不會自動合併）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
